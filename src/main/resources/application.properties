# ===== MySQL (credenciales por variables de entorno; valores por defecto solo para desarrollo local) =====
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/caketrack_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Bogota}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===== Thymeleaf =====
spring.thymeleaf.cache=false

# ===== Mensajes =====
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# ===== Server (Render asigna el puerto mediante la variable PORT) =====
server.port=${PORT:8080}

# ===== Application =====
spring.application.name=CakeTrack
