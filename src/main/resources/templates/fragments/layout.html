<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' · CakeTrack'">CakeTrack</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&family=Playfair+Display:wght@300&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/caketrack.css}">
</head>

<div th:fragment="anuncio" class="caketrack-anuncio">CakeTrack · Gestión para pastelería artesanal</div>

<nav th:fragment="navbar" class="navbar navbar-expand-lg caketrack-navbar" sec:authorize="isAuthenticated()">
    <div class="container">
        <a class="navbar-brand" th:href="@{/inicio}">CakeTrack</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
                aria-controls="menuPrincipal" aria-expanded="false" aria-label="Mostrar menú">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/inicio}"><i class="bi bi-house"></i> Inicio</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/catalogo}"><i class="bi bi-book"></i> Catálogo de productos</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/admin/usuarios}"><i class="bi bi-people"></i> Usuarios</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('ADMIN', 'PASTELERO')">
                    <a class="nav-link" th:href="@{/admin/ingredientes}"><i class="bi bi-basket"></i> Ingredientes</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('ADMIN', 'PASTELERO')">
                    <a class="nav-link" th:href="@{/admin/productos}"><i class="bi bi-box-seam"></i> Productos</a>
                </li>
            </ul>
            <form th:action="@{/logout}" method="post" class="d-flex">
                <button type="submit" class="btn btn-outline-primary btn-sm"><i class="bi bi-box-arrow-right"></i> Cerrar sesión</button>
            </form>
        </div>
    </div>
</nav>

<footer th:fragment="pie" class="caketrack-pie text-center py-3">
    <span>© CakeTrack</span>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</footer>
</html>
