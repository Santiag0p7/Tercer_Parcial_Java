<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Iniciar sesión')}"></head>
<body class="bg-light">
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-8 col-md-5 col-lg-4">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h4 mb-3 text-center">CakeTrack</h1>

                    <div class="alert alert-danger" th:if="${param.error}">Credenciales inválidas</div>
                    <div class="alert alert-warning" th:if="${param.inactivo}">
                        Su cuenta está inactiva. Contacte al administrador
                    </div>
                    <div class="alert alert-success" th:if="${param.logout}">Sesión cerrada correctamente</div>
                    <div class="alert alert-success" th:if="${param.restablecido}">
                        Contraseña actualizada. Inicie sesión con su nueva contraseña
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label">Correo electrónico</label>
                            <input type="email" class="form-control" id="username" name="username" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Ingresar</button>
                    </form>

                    <div class="mt-3 text-center">
                        <a th:href="@{/recuperar}">¿Olvidó su contraseña?</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
<div th:replace="~{fragments/layout :: pie}"></div>
</body>
</html>
