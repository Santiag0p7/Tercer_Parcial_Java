<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Catálogo')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/layout :: anuncio}"></div>
<div th:replace="~{fragments/layout :: navbar}"></div>
<main class="container py-4">
    <h1 class="h3 mb-3">Catálogo de productos</h1>

    <div class="d-flex flex-wrap gap-2 mb-4">
        <a class="btn btn-sm" th:classappend="${tipoSeleccionado == null} ? 'btn-dark' : 'btn-outline-dark'"
           th:href="@{/catalogo}">Todos</a>
        <a th:each="t : ${tipos}" class="btn btn-sm"
           th:classappend="${tipoSeleccionado == t} ? 'btn-dark' : 'btn-outline-dark'"
           th:href="@{/catalogo(tipo=${t})}" th:text="${t}">TIPO</a>
    </div>

    <div class="alert alert-light border" th:if="${#lists.isEmpty(productos)}">
        No hay productos disponibles en este momento
    </div>

    <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-4">
        <div class="col" th:each="p : ${productos}">
            <div class="card h-100 shadow-sm">
                <div class="card-body d-flex flex-column">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <h2 class="h5 mb-0" th:text="${p.nombre}">Producto</h2>
                        <span class="badge bg-info text-dark" th:text="${p.tipo}">TORTA</span>
                    </div>
                    <p class="card-text text-muted flex-grow-1" th:text="${p.descripcion}">Descripción</p>
                    <p class="fs-5 fw-bold text-primary mb-0"
                       th:text="'$ ' + ${#numbers.formatDecimal(p.precio, 1, 'POINT', 0, 'COMMA')}">$ 0</p>
                </div>
            </div>
        </div>
    </div>
</main>
<div th:replace="~{fragments/layout :: pie}"></div>
</body>
</html>
