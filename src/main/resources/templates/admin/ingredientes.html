<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Ingredientes')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/layout :: anuncio}"></div>
<div th:replace="~{fragments/layout :: navbar}"></div>
<main class="container py-4">
    <h1 class="h3 mb-3">Inventario de ingredientes</h1>

    <div class="alert alert-success" th:if="${mensaje}" th:text="${mensaje}">Mensaje</div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}">Error</div>

    <div class="row g-4">
        <div class="col-12 col-lg-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h2 class="h5 mb-3" th:text="${edicion} ? 'Editar ingrediente' : 'Nuevo ingrediente'">Nuevo ingrediente</h2>

                    <form th:unless="${edicion}" th:action="@{/admin/ingredientes/crear}" method="post">
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="nombre" name="nombre"
                                   th:value="${nombre}" required>
                        </div>
                        <div class="mb-3">
                            <label for="unidadMedida" class="form-label">Unidad de medida</label>
                            <input type="text" class="form-control" id="unidadMedida" name="unidadMedida"
                                   th:value="${unidadMedida}" placeholder="kg, g, L, unidad" required>
                        </div>
                        <div class="mb-3">
                            <label for="cantidadActual" class="form-label">Cantidad actual</label>
                            <input type="number" step="0.01" min="0" class="form-control" id="cantidadActual"
                                   name="cantidadActual" th:value="${cantidadActual}" required>
                        </div>
                        <div class="mb-3">
                            <label for="stockMinimo" class="form-label">Stock mínimo</label>
                            <input type="number" step="0.01" min="0" class="form-control" id="stockMinimo"
                                   name="stockMinimo" th:value="${stockMinimo}" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Registrar ingrediente</button>
                    </form>

                    <form th:if="${edicion}" th:action="@{/admin/ingredientes/{id}/editar(id=${id})}" method="post">
                        <div class="mb-3">
                            <label for="nombreEdit" class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="nombreEdit" name="nombre"
                                   th:value="${nombre}" required>
                        </div>
                        <div class="mb-3">
                            <label for="unidadEdit" class="form-label">Unidad de medida</label>
                            <input type="text" class="form-control" id="unidadEdit" name="unidadMedida"
                                   th:value="${unidadMedida}" required>
                        </div>
                        <div class="mb-3">
                            <label for="cantidadEdit" class="form-label">Cantidad actual</label>
                            <input type="number" step="0.01" min="0" class="form-control" id="cantidadEdit"
                                   name="cantidadActual" th:value="${cantidadActual}" required>
                        </div>
                        <div class="mb-3">
                            <label for="minimoEdit" class="form-label">Stock mínimo</label>
                            <input type="number" step="0.01" min="0" class="form-control" id="minimoEdit"
                                   name="stockMinimo" th:value="${stockMinimo}" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Guardar cambios</button>
                        <a class="btn btn-link w-100 mt-2" th:href="@{/admin/ingredientes}">Cancelar</a>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-12 col-lg-8">
            <div class="card shadow-sm">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                        <tr>
                            <th>Ingrediente</th>
                            <th>Unidad</th>
                            <th class="text-end">Actual</th>
                            <th class="text-end">Mínimo</th>
                            <th>Estado</th>
                            <th class="text-end">Acciones</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="i : ${ingredientes}" th:classappend="${i.bajoStockMinimo} ? 'table-danger'">
                            <td th:text="${i.nombre}">Nombre</td>
                            <td th:text="${i.unidadMedida}">kg</td>
                            <td class="text-end" th:text="${i.cantidadActual}">0</td>
                            <td class="text-end" th:text="${i.stockMinimo}">0</td>
                            <td>
                                <span class="badge bg-danger" th:if="${i.bajoStockMinimo}">Reponer</span>
                                <span class="badge bg-success" th:unless="${i.bajoStockMinimo}">Normal</span>
                            </td>
                            <td class="text-end">
                                <a class="btn btn-sm btn-outline-primary"
                                   th:href="@{/admin/ingredientes/{id}/editar(id=${i.id})}">Editar</a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</main>
<div th:replace="~{fragments/layout :: pie}"></div>
</body>
</html>
