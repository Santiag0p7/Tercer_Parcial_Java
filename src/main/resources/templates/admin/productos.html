<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Productos')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/layout :: anuncio}"></div>
<div th:replace="~{fragments/layout :: navbar}"></div>
<main class="container py-4">
    <h1 class="h3 mb-3">Catálogo de tortas y postres</h1>

    <div class="alert alert-success" th:if="${mensaje}" th:text="${mensaje}">Mensaje</div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}">Error</div>

    <div class="row g-4">
        <div class="col-12 col-lg-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h2 class="h5 mb-3">Nuevo producto</h2>
                    <form th:action="@{/admin/productos/crear}" method="post">
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="nombre" name="nombre"
                                   th:value="${nombre}" required>
                        </div>
                        <div class="mb-3">
                            <label for="tipo" class="form-label">Tipo</label>
                            <select class="form-select" id="tipo" name="tipo" required>
                                <option th:each="t : ${tipos}" th:value="${t}" th:text="${t}"
                                        th:selected="${t == tipo}">TIPO</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="precio" class="form-label">Precio (COP)</label>
                            <input type="number" step="1" min="1" class="form-control" id="precio" name="precio"
                                   th:value="${precio}" required>
                        </div>
                        <div class="mb-3">
                            <label for="descripcion" class="form-label">Descripción</label>
                            <textarea class="form-control" id="descripcion" name="descripcion" rows="2"
                                      th:text="${descripcion}"></textarea>
                        </div>
                        <p class="form-label mb-1">Receta (ingrediente y cantidad)</p>
                        <div class="row g-2 mb-2" th:each="fila : ${#numbers.sequence(1, 3)}">
                            <div class="col-7">
                                <select class="form-select form-select-sm" name="ingredienteId">
                                    <option value="">-- Ingrediente --</option>
                                    <option th:each="ing : ${ingredientes}" th:value="${ing.id}"
                                            th:text="${ing.nombre}">Ingrediente</option>
                                </select>
                            </div>
                            <div class="col-5">
                                <input type="number" step="0.01" min="0.01" class="form-control form-control-sm"
                                       name="cantidad" placeholder="Cantidad">
                            </div>
                        </div>
                        <div class="form-text mb-3">Debe incluir al menos un ingrediente. El producto se crea como no disponible.</div>
                        <button type="submit" class="btn btn-primary w-100">Crear producto</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-12 col-lg-8">
            <div class="card shadow-sm mb-3" th:each="p : ${productos}">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
                        <div>
                            <h2 class="h5 mb-1" th:text="${p.nombre}">Producto</h2>
                            <span class="badge bg-info text-dark me-1" th:text="${p.tipo}">TORTA</span>
                            <span class="fw-semibold" th:text="${#numbers.formatDecimal(p.precio, 1, 'POINT', 0, 'COMMA')}">0</span>
                        </div>
                        <div class="d-flex align-items-center gap-2">
                            <span class="badge bg-success" th:if="${p.disponible}">Disponible</span>
                            <span class="badge bg-secondary" th:unless="${p.disponible}">No disponible</span>
                            <form th:action="@{/admin/productos/{id}/disponibilidad(id=${p.id})}" method="post">
                                <button type="submit" class="btn btn-sm"
                                        th:classappend="${p.disponible} ? 'btn-outline-danger' : 'btn-outline-success'"
                                        th:text="${p.disponible} ? 'Marcar no disponible' : 'Marcar disponible'">Marcar disponible</button>
                            </form>
                        </div>
                    </div>

                    <ul class="list-unstyled small mt-3 mb-2">
                        <li class="d-flex justify-content-between align-items-center" th:each="item : ${p.receta}">
                            <span th:text="${item.ingrediente.nombre} + ': ' + ${item.cantidad} + ' ' + ${item.ingrediente.unidadMedida}">Ingrediente</span>
                            <form th:action="@{/admin/productos/{id}/receta/{ing}/quitar(id=${p.id}, ing=${item.ingrediente.id})}"
                                  method="post">
                                <button type="submit" class="btn btn-link btn-sm text-danger p-0">Quitar</button>
                            </form>
                        </li>
                        <li class="text-muted" th:if="${#lists.isEmpty(p.receta)}">Sin ingredientes en la receta</li>
                    </ul>

                    <form class="row g-2 align-items-end" th:action="@{/admin/productos/{id}/receta(id=${p.id})}" method="post">
                        <div class="col-6">
                            <select class="form-select form-select-sm" name="ingredienteId" required>
                                <option value="">-- Ingrediente --</option>
                                <option th:each="ing : ${ingredientes}" th:value="${ing.id}"
                                        th:text="${ing.nombre}">Ingrediente</option>
                            </select>
                        </div>
                        <div class="col-3">
                            <input type="number" step="0.01" min="0.01" class="form-control form-control-sm"
                                   name="cantidad" placeholder="Cantidad" required>
                        </div>
                        <div class="col-3">
                            <button type="submit" class="btn btn-sm btn-outline-primary w-100">Agregar / actualizar</button>
                        </div>
                    </form>
                </div>
            </div>
            <div class="alert alert-light border" th:if="${#lists.isEmpty(productos)}">
                Aún no hay productos registrados.
            </div>
        </div>
    </div>
</main>
<div th:replace="~{fragments/layout :: pie}"></div>
</body>
</html>
