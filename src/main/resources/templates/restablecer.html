<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Restablecer contraseña')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/layout :: anuncio}"></div>
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-8 col-md-5 col-lg-4">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h4 mb-3 text-center">Restablecer contraseña</h1>

                    <div class="alert alert-danger" th:if="${error}" th:text="${error}">Error</div>

                    <form th:if="${valido}" th:action="@{/restablecer}" method="post">
                        <input type="hidden" name="token" th:value="${token}">
                        <div class="mb-3">
                            <label for="password" class="form-label">Nueva contraseña</label>
                            <input type="password" class="form-control" id="password" name="password"
                                   minlength="8" required autofocus>
                            <div class="form-text">Mínimo 8 caracteres.</div>
                        </div>
                        <div class="mb-3">
                            <label for="confirmacion" class="form-label">Confirmar contraseña</label>
                            <input type="password" class="form-control" id="confirmacion" name="confirmacion"
                                   minlength="8" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Guardar contraseña</button>
                    </form>

                    <div th:unless="${valido}" class="text-center">
                        <a th:href="@{/recuperar}">Solicitar un nuevo enlace</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
<div th:replace="~{fragments/layout :: pie}"></div>
</body>
</html>
